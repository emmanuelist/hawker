# Render Blueprint: one persistent Node web service (D-002, D-008).
# Field names checked against https://render.com/docs/blueprint-spec.md on 2026-11-07.
# Node version comes from .node-version (Render docs: node-version).
services:
  - type: web
    name: hawker
    runtime: node
    # Free plan (D-011): a paid plan needs a card on file, even with the hackathon credit.
    # Free web services sleep after 15 min without inbound HTTP traffic (render.com/docs/free),
    # so the app keeps itself warm from M1, and all state lives in an external database.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
